<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Plan de Entrenamiento</title>
    <style>
        :root {
            --color-fuego: #ff4d00;
            --color-fuego-claro: #ff8533;
            --color-metal: #1a1a1a;
            --color-metal-claro: #2d2d2d;
            --color-acero: #4a4a4a;
            --color-texto: #ffffff;
            --color-texto-secundario: #cccccc;
        }

        body {
            background-color: var(--color-metal);
            color: var(--color-texto);
            font-family: 'Arial', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            background: linear-gradient(45deg, var(--color-metal), var(--color-acero));
            color: var(--color-texto);
            padding: 1.5rem;
            width: 100%;
            text-align: center;
            border-bottom: 3px solid var(--color-fuego);
            box-shadow: 0 4px 15px rgba(255, 77, 0, 0.2);
        }

        .logo-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            position: relative;
            border-radius: 10px;
            padding: 1rem;
            background: transparent;
            overflow: hidden;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-container:hover .logo-image {
            transform: scale(1.05);
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 77, 0, 0.5);
        }

        .container {
            max-width: 500px;
            width: 90%;
            margin: 2rem auto;
            padding: 2rem;
            background: linear-gradient(145deg, var(--color-metal-claro), var(--color-acero));
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-fuego);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-fuego-claro);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--color-metal);
            border: 2px solid var(--color-acero);
            border-radius: 5px;
            color: var(--color-texto);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--color-fuego);
            box-shadow: 0 0 10px rgba(255, 77, 0, 0.3);
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-fuego-claro);
        }

        .error-message {
            background-color: rgba(255, 77, 0, 0.1);
            color: var(--color-fuego);
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--color-fuego);
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            min-width: 200px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,77,0,0.3) 0%, rgba(255,77,0,0) 70%);
            transform: scale(0);
            transition: transform 0.5s ease-out;
        }

        .btn:hover::before {
            transform: scale(1);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--color-fuego), var(--color-fuego-claro));
            color: var(--color-texto);
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(255, 77, 0, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(45deg, var(--color-acero), var(--color-metal-claro));
            color: var(--color-texto);
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        .text-center {
            text-align: center;
            margin-top: 2rem;
        }

        .text-center p {
            margin-bottom: 1rem;
            color: var(--color-texto-secundario);
        }

        .generator-button {
            background: linear-gradient(45deg, var(--color-metal), var(--color-acero));
            color: var(--color-fuego);
            border: 1px solid var(--color-fuego);
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            margin-top: 1rem;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .generator-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,77,0,0.2) 0%, rgba(255,77,0,0) 70%);
            transform: scale(0);
            transition: transform 0.5s ease-out;
        }

        .generator-button:hover::before {
            transform: scale(1);
        }

        .generator-button:hover {
            background: linear-gradient(45deg, var(--color-acero), var(--color-metal));
            box-shadow: 0 0 15px rgba(255, 77, 0, 0.3);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo-negro.png') }}" alt="Logo T-DYNAMI" class="logo-image">
        </div>
    </header>

    <div class="container">
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <div id="login-form">
            <h2 style="color: var(--color-fuego); margin-bottom: 2rem; text-align: center;">Iniciar Sesión</h2>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="form_type" value="login">
                <div class="form-group">
                    <label for="login-usuario">Usuario:</label>
                    <input type="text" id="login-usuario" name="usuario" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <div class="password-container">
                        <input type="password" id="login-password" name="password" required>
                        <span class="toggle-password" onclick="togglePassword('login-password')">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <div class="text-center" style="margin: 1.5rem 0;">
                <p style="color: var(--color-texto-secundario);">¿No tienes cuenta? 
                    <a href="#" onclick="toggleForms()" style="color: var(--color-fuego);">Regístrate</a>
                </p>
            </div>

            <div class="generator-buttons" style="margin-top: 1.5rem;">
                <button type="button" class="generator-button" onclick="generarUsuario()" style="margin-bottom: 1rem;">Generar Usuario</button>
                <button type="button" class="generator-button" onclick="generarContraseña()">Generar Contraseña</button>
            </div>

            <div class="text-center" style="margin-top: 2rem;">
                <a href="{{ url_for('acceder_sin_registro') }}" class="btn btn-secondary">Acceder sin Registro</a>
            </div>
        </div>

        <div id="registro-form" style="display: none;">
            <h2 style="color: var(--color-fuego); margin-bottom: 2rem; text-align: center;">Registro</h2>
            <form method="POST" action="{{ url_for('registro') }}" id="registroForm">
                <input type="hidden" name="form_type" value="registro">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>

                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required>
                        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>
            <p style="text-align: center; color: var(--color-texto-secundario);">¿Ya tienes cuenta? 
                <a href="#" onclick="toggleForms()" style="color: var(--color-fuego);">Iniciar Sesión</a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function toggleForms() {
            const registroForm = document.getElementById('registro-form');
            const loginForm = document.getElementById('login-form');
            
            if (registroForm.style.display === 'none') {
                registroForm.style.display = 'block';
                loginForm.style.display = 'none';
            } else {
                registroForm.style.display = 'none';
                loginForm.style.display = 'block';
            }
        }

        function generarUsuario() {
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;
            if (nombre && apellidos) {
                const usuario = (nombre.charAt(0) + apellidos.split(' ')[0]).toLowerCase();
                document.getElementById('usuario').value = usuario;
            }
        }

        function generarContraseña() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let contraseña = '';
            for (let i = 0; i < 12; i++) {
                contraseña += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            document.getElementById('password').value = contraseña;
        }
    </script>
</body>
</html>
