<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Full Body</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #3d9f4b, #6bbf67); /* Fondo verde frondoso */
            color: #fff; /* Texto blanco para contraste */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            line-height: 1.6;
        }

        /* Main container for content */
        section {
            width: 80%;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.5); /* Fondo oscuro traslúcido para el contenido */
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); /* Sombra sutil para dar profundidad */
        }

        /* Title styles */
        h2 {
            font-size: 2.8rem;
            text-align: center;
            color: #ffbb33; /* Color dorado suave, evocando un toque natural y cálido */
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Sombra para efecto 3D */
        }

        h3 {
            font-size: 2rem;
            color: #ffbb33; /* Color dorado para subtítulos */
            margin-top: 30px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* List styling */
        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-left: 25px;
            position: relative;
            color: #dcdcdc; /* Gris claro para los elementos de lista */
        }

        li::before {
            content: "\2022"; /* Bullet point */
            font-size: 1.7rem;
            color: #3a7d3a; /* Color verde intenso */
            position: absolute;
            left: 0;
            top: 0;
        }

        /* Strong emphasis */
        strong {
            color: #ffbb33; /* Color dorado suave para las etiquetas importantes */
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Additional section styles */
        section p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #dcdcdc; /* Gris claro para el texto de párrafos */
        }

        /* Hover effect for list items */
        li:hover {
            background-color: #4caf50; /* Verde más brillante al pasar el ratón */
            color: #fff; /* Cambiar color de texto al pasar el ratón */
            padding-left: 30px; /* Desplazamiento hacia la derecha al hacer hover */
            transition: background-color 0.3s, padding-left 0.3s ease;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            section {
                width: 90%;
            }

            h2 {
                font-size: 2.5rem;
            }

            h3 {
                font-size: 1.7rem;
            }

            li {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <section>
        <h2>5. Rutina Full Body</h2>
        <p><strong>Objetivo:</strong> Entrenar todo el cuerpo en cada sesión, ideal para principiantes o personas con poco tiempo.</p>

        <h3>Día 1:</h3>
        <ul>
            <li>Sentadilla: 3x8-12</li>
            <li>Press de banca: 3x8-12</li>
            <li>Pull-up: 3x6-10</li>
            <li>Press militar: 3x8-10</li>
            <li>Elevaciones de talones (gemelos): 3x12-15</li>
            <li>Abdominales: 3x15-20</li>
        </ul>
    </section>
</body>
</html>
