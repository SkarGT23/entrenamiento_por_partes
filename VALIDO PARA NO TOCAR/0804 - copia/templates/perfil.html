{% extends "base.html" %}

{% block title %}Mi Perfil - Sistema de Entrenamiento{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="profile-header">
        <h1>Mi Perfil</h1>
        <p>Gestiona tu información personal y preferencias</p>
    </div>

    <div class="profile-grid">
        <!-- Información Personal -->
        <div class="profile-card">
            <h2>Información Personal</h2>
            <form id="profile-form" class="profile-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" value="{{ usuario.apellidos }}" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" value="{{ usuario.usuario }}" disabled>
                </div>
                <button type="submit" class="btn-primary">Guardar Cambios</button>
            </form>
        </div>

        <!-- Cambiar Contraseña -->
        <div class="profile-card">
            <h2>Cambiar Contraseña</h2>
            <form id="password-form" class="profile-form">
                <div class="form-group">
                    <label for="password_actual">Contraseña Actual:</label>
                    <input type="password" id="password_actual" name="password_actual" required>
                </div>
                <div class="form-group">
                    <label for="nuevo_password">Nueva Contraseña:</label>
                    <input type="password" id="nuevo_password" name="nuevo_password" required>
                </div>
                <div class="form-group">
                    <label for="confirmar_password">Confirmar Nueva Contraseña:</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" required>
                </div>
                <button type="submit" class="btn-primary">Cambiar Contraseña</button>
            </form>
        </div>

        <!-- Medidas Corporales -->
        <div class="profile-card">
            <h2>Medidas Corporales</h2>
            <form id="measurements-form" class="profile-form">
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="altura">Altura (cm):</label>
                    <input type="number" id="altura" name="altura" required>
                </div>
                <div class="form-group">
                    <label for="cintura">Cintura (cm):</label>
                    <input type="number" id="cintura" name="cintura" step="0.1">
                </div>
                <div class="form-group">
                    <label for="cadera">Cadera (cm):</label>
                    <input type="number" id="cadera" name="cadera" step="0.1">
                </div>
                <div class="form-group">
                    <label for="brazo">Brazo (cm):</label>
                    <input type="number" id="brazo" name="brazo" step="0.1">
                </div>
                <div class="form-group">
                    <label for="pierna">Pierna (cm):</label>
                    <input type="number" id="pierna" name="pierna" step="0.1">
                </div>
                <button type="submit" class="btn-primary">Guardar Medidas</button>
            </form>
        </div>

        <!-- Preferencias -->
        <div class="profile-card">
            <h2>Preferencias</h2>
            <form id="preferences-form" class="profile-form">
                <div class="form-group">
                    <label for="sistema_unidades">Sistema de Unidades:</label>
                    <select id="sistema_unidades" name="sistema_unidades">
                        <option value="metrico">Métrico (kg, cm)</option>
                        <option value="imperial">Imperial (lb, in)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="idioma">Idioma:</label>
                    <select id="idioma" name="idioma">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="notificaciones_email" id="notificaciones_email">
                        Recibir notificaciones por email
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="notificaciones_push" id="notificaciones_push">
                        Recibir notificaciones push
                    </label>
                </div>
                <button type="submit" class="btn-primary">Guardar Preferencias</button>
            </form>
        </div>
    </div>
</div>

<style>
.profile-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.profile-header {
    text-align: center;
    margin-bottom: 2rem;
}

.profile-header h1 {
    color: var(--color-fuego);
    margin-bottom: 0.5rem;
}

.profile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
}

.profile-card {
    background: var(--color-metal);
    border-radius: 10px;
    padding: 1.5rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 1px solid var(--color-fuego);
}

.profile-card h2 {
    color: var(--color-fuego);
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
}

.profile-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    color: var(--color-texto);
    font-size: 0.9rem;
}

.form-group input,
.form-group select {
    padding: 0.8rem;
    background: var(--color-metal-claro);
    border: 1px solid var(--color-fuego-claro);
    border-radius: 5px;
    color: var(--color-texto);
    font-size: 1rem;
}

.form-group input:disabled {
    background: var(--color-acero);
    cursor: not-allowed;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] {
    width: 1.2rem;
    height: 1.2rem;
}

.btn-primary {
    background: var(--color-fuego);
    color: white;
    border: none;
    padding: 1rem;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
}

.btn-primary:hover {
    background: var(--color-fuego-claro);
}

@media (max-width: 768px) {
    .profile-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Manejar actualización de perfil
    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        fetch('/actualizar_perfil', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            alert('Error al actualizar el perfil');
        });
    });

    // Manejar cambio de contraseña
    document.getElementById('password-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        fetch('/actualizar_password', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                this.reset();
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            alert('Error al cambiar la contraseña');
        });
    });

    // Manejar actualización de medidas
    document.getElementById('measurements-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        fetch('/actualizar_medidas', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            alert('Error al actualizar las medidas');
        });
    });

    // Manejar actualización de preferencias
    document.getElementById('preferences-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        fetch('/actualizar_preferencias', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            alert('Error al actualizar las preferencias');
        });
    });
});
</script>
{% endblock %}
