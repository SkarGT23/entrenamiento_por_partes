{% extends "base.html" %}

{% block title %}Registro/Login - Sistema de Entrenamiento{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
            <button class="auth-tab" data-tab="registro">Registrarse</button>
        </div>

        <!-- Formulario de Login -->
        <div class="auth-form active" id="login-form">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="login-usuario">Usuario:</label>
                    <input type="text" id="login-usuario" name="usuario" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                        <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('acceder_sin_registro') }}" class="btn-secondary">Acceder sin Registro</a>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="auth-form" id="registro-form">
            <form action="{{ url_for('registro') }}" method="POST">
                <input type="hidden" name="form_type" value="registro">
                <div class="form-group">
                    <label for="registro-nombre">Nombre:</label>
                    <input type="text" id="registro-nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="registro-apellidos">Apellidos:</label>
                    <input type="text" id="registro-apellidos" name="apellidos" required>
                </div>
                <div class="form-group">
                    <label for="registro-usuario">Usuario:</label>
                    <input type="text" id="registro-usuario" name="usuario" required>
                </div>
                <div class="form-group">
                    <label for="registro-password">Contraseña:</label>
                    <input type="password" id="registro-password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 200px);
    padding: 2rem;
}

.auth-box {
    background: var(--color-metal);
    border-radius: 10px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 1px solid var(--color-fuego);
}

.auth-tabs {
    display: flex;
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--color-fuego);
}

.auth-tab {
    flex: 1;
    padding: 1rem;
    background: none;
    border: none;
    color: var(--color-texto);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.auth-tab.active {
    color: var(--color-fuego);
    border-bottom: 2px solid var(--color-fuego);
    margin-bottom: -2px;
}

.auth-form {
    display: none;
}

.auth-form.active {
    display: block;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--color-texto);
    font-size: 0.9rem;
}

.form-group input {
    width: 100%;
    padding: 0.8rem;
    background: var(--color-metal-claro);
    border: 1px solid var(--color-fuego-claro);
    border-radius: 5px;
    color: var(--color-texto);
    font-size: 1rem;
}

.form-group input:focus {
    outline: none;
    border-color: var(--color-fuego);
}

.btn-primary {
    width: 100%;
    padding: 1rem;
    background: var(--color-fuego);
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    background: var(--color-fuego-claro);
}

.btn-secondary {
    display: block;
    width: 100%;
    padding: 1rem;
    background: var(--color-metal-claro);
    color: var(--color-texto);
    border: 1px solid var(--color-fuego);
    border-radius: 5px;
    font-size: 1rem;
    text-align: center;
    text-decoration: none;
    margin-top: 1rem;
    transition: all 0.3s ease;
}

.btn-secondary:hover {
    background: var(--color-fuego);
    color: white;
}

.auth-links {
    margin-top: 1.5rem;
    text-align: center;
}

.error-message {
    margin-top: 1rem;
    padding: 1rem;
    background: rgba(255, 0, 0, 0.1);
    border: 1px solid #ff0000;
    border-radius: 5px;
    color: #ff0000;
    text-align: center;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            // Remover clase active de todos los tabs y forms
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            // Agregar clase active al tab y form seleccionado
            tab.classList.add('active');
            const formId = `${tab.dataset.tab}-form`;
            document.getElementById(formId).classList.add('active');
        });
    });
});
    </script>
{% endblock %}
