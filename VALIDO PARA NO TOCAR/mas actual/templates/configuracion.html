{% extends "base.html" %}

{% block title %}Configuración - Sistema de Entrenamiento{% endblock %}

{% block content %}
<div class="configuracion-container">
    <h1>Configuración</h1>
    
    <div class="configuracion-grid">
        <!-- Configuración General -->
        <div class="configuracion-card">
            <h2>Configuración General</h2>
            <form id="general-form" class="configuracion-form">
                <div class="form-group">
                    <label for="tema">Tema:</label>
                    <select id="tema" name="tema" required>
                        <option value="oscuro" {% if config.tema == 'oscuro' %}selected{% endif %}>Oscuro</option>
                        <option value="claro" {% if config.tema == 'claro' %}selected{% endif %}>Claro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="zona_horaria">Zona Horaria:</label>
                    <select id="zona_horaria" name="zona_horaria" required>
                        <option value="UTC" {% if config.zona_horaria == 'UTC' %}selected{% endif %}>UTC</option>
                        <option value="America/Mexico_City" {% if config.zona_horaria == 'America/Mexico_City' %}selected{% endif %}>Ciudad de México</option>
                        <option value="America/New_York" {% if config.zona_horaria == 'America/New_York' %}selected{% endif %}>Nueva York</option>
                        <option value="Europe/Madrid" {% if config.zona_horaria == 'Europe/Madrid' %}selected{% endif %}>Madrid</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="formato_fecha">Formato de Fecha:</label>
                    <select id="formato_fecha" name="formato_fecha" required>
                        <option value="DD/MM/YYYY" {% if config.formato_fecha == 'DD/MM/YYYY' %}selected{% endif %}>DD/MM/YYYY</option>
                        <option value="MM/DD/YYYY" {% if config.formato_fecha == 'MM/DD/YYYY' %}selected{% endif %}>MM/DD/YYYY</option>
                        <option value="YYYY-MM-DD" {% if config.formato_fecha == 'YYYY-MM-DD' %}selected{% endif %}>YYYY-MM-DD</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Configuración General
                </button>
            </form>
        </div>
        
        <!-- Configuración de Entrenamiento -->
        <div class="configuracion-card">
            <h2>Configuración de Entrenamiento</h2>
            <form id="entrenamiento-form" class="configuracion-form">
                <div class="form-group">
                    <label for="dias_entrenamiento">Días de Entrenamiento:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="lunes" {% if 'lunes' in config.dias_entrenamiento %}checked{% endif %}>
                            Lunes
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="martes" {% if 'martes' in config.dias_entrenamiento %}checked{% endif %}>
                            Martes
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="miercoles" {% if 'miercoles' in config.dias_entrenamiento %}checked{% endif %}>
                            Miércoles
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="jueves" {% if 'jueves' in config.dias_entrenamiento %}checked{% endif %}>
                            Jueves
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="viernes" {% if 'viernes' in config.dias_entrenamiento %}checked{% endif %}>
                            Viernes
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="sabado" {% if 'sabado' in config.dias_entrenamiento %}checked{% endif %}>
                            Sábado
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="dias_entrenamiento" value="domingo" {% if 'domingo' in config.dias_entrenamiento %}checked{% endif %}>
                            Domingo
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hora_entrenamiento">Hora de Entrenamiento:</label>
                    <input type="time" id="hora_entrenamiento" name="hora_entrenamiento" value="{{ config.hora_entrenamiento }}" required>
                </div>
                
                <div class="form-group">
                    <label for="duracion_entrenamiento">Duración del Entrenamiento (minutos):</label>
                    <input type="number" id="duracion_entrenamiento" name="duracion_entrenamiento" value="{{ config.duracion_entrenamiento }}" min="15" max="180" step="15" required>
                </div>
                
                <div class="form-group">
                    <label for="nivel_entrenamiento">Nivel de Entrenamiento:</label>
                    <select id="nivel_entrenamiento" name="nivel_entrenamiento" required>
                        <option value="principiante" {% if config.nivel_entrenamiento == 'principiante' %}selected{% endif %}>Principiante</option>
                        <option value="intermedio" {% if config.nivel_entrenamiento == 'intermedio' %}selected{% endif %}>Intermedio</option>
                        <option value="avanzado" {% if config.nivel_entrenamiento == 'avanzado' %}selected{% endif %}>Avanzado</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Configuración de Entrenamiento
                </button>
            </form>
        </div>
        
        <!-- Configuración de Notificaciones -->
        <div class="configuracion-card">
            <h2>Configuración de Notificaciones</h2>
            <form id="notificaciones-form" class="configuracion-form">
                <div class="form-group">
                    <label for="notificaciones_email">Notificaciones por Email:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_email" value="recordatorio" {% if 'recordatorio' in config.notificaciones_email %}checked{% endif %}>
                            Recordatorio de Entrenamiento
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_email" value="progreso" {% if 'progreso' in config.notificaciones_email %}checked{% endif %}>
                            Resumen de Progreso
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_email" value="objetivos" {% if 'objetivos' in config.notificaciones_email %}checked{% endif %}>
                            Actualización de Objetivos
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notificaciones_push">Notificaciones Push:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_push" value="recordatorio" {% if 'recordatorio' in config.notificaciones_push %}checked{% endif %}>
                            Recordatorio de Entrenamiento
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_push" value="progreso" {% if 'progreso' in config.notificaciones_push %}checked{% endif %}>
                            Resumen de Progreso
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="notificaciones_push" value="objetivos" {% if 'objetivos' in config.notificaciones_push %}checked{% endif %}>
                            Actualización de Objetivos
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hora_notificaciones">Hora de Notificaciones:</label>
                    <input type="time" id="hora_notificaciones" name="hora_notificaciones" value="{{ config.hora_notificaciones }}" required>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Configuración de Notificaciones
                </button>
            </form>
        </div>
        
        <!-- Configuración de Privacidad -->
        <div class="configuracion-card">
            <h2>Configuración de Privacidad</h2>
            <form id="privacidad-form" class="configuracion-form">
                <div class="form-group">
                    <label for="perfil_publico">Perfil Público:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="perfil_publico" name="perfil_publico" {% if config.perfil_publico %}checked{% endif %}>
                            Permitir que otros usuarios vean mi perfil
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="mostrar_progreso">Mostrar Progreso:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="mostrar_progreso" value="peso" {% if 'peso' in config.mostrar_progreso %}checked{% endif %}>
                            Peso
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="mostrar_progreso" value="medidas" {% if 'medidas' in config.mostrar_progreso %}checked{% endif %}>
                            Medidas
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="mostrar_progreso" value="objetivos" {% if 'objetivos' in config.mostrar_progreso %}checked{% endif %}>
                            Objetivos
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="mostrar_galeria">Mostrar Galería:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="mostrar_galeria" value="antes_despues" {% if 'antes_despues' in config.mostrar_galeria %}checked{% endif %}>
                            Fotos Antes/Después
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="mostrar_galeria" value="progreso" {% if 'progreso' in config.mostrar_galeria %}checked{% endif %}>
                            Fotos de Progreso
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Configuración de Privacidad
                </button>
            </form>
        </div>
    </div>
</div>

<style>
.configuracion-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.configuracion-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.configuracion-card {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    padding: 20px;
}

.configuracion-card h2 {
    color: #ff4d00;
    margin-bottom: 20px;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.configuracion-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-group label {
    color: #ff8533;
    font-size: 0.9rem;
}

.form-group input,
.form-group select {
    padding: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.2);
    color: white;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #ff4d00;
}

.checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 5px;
    color: white;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
}

.btn-primary {
    background: #ff4d00;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s ease;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #ff8533;
}

@media (max-width: 768px) {
    .configuracion-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
// Manejar el envío del formulario de configuración general
document.getElementById('general-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const response = await fetch('/actualizar_configuracion_general', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Configuración general actualizada correctamente');
        } else {
            alert(result.error || 'Error al actualizar la configuración general');
        }
    } catch (error) {
        alert('Error al actualizar la configuración general');
        console.error(error);
    }
});

// Manejar el envío del formulario de configuración de entrenamiento
document.getElementById('entrenamiento-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const response = await fetch('/actualizar_configuracion_entrenamiento', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Configuración de entrenamiento actualizada correctamente');
        } else {
            alert(result.error || 'Error al actualizar la configuración de entrenamiento');
        }
    } catch (error) {
        alert('Error al actualizar la configuración de entrenamiento');
        console.error(error);
    }
});

// Manejar el envío del formulario de configuración de notificaciones
document.getElementById('notificaciones-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const response = await fetch('/actualizar_configuracion_notificaciones', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Configuración de notificaciones actualizada correctamente');
        } else {
            alert(result.error || 'Error al actualizar la configuración de notificaciones');
        }
    } catch (error) {
        alert('Error al actualizar la configuración de notificaciones');
        console.error(error);
    }
});

// Manejar el envío del formulario de configuración de privacidad
document.getElementById('privacidad-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const response = await fetch('/actualizar_configuracion_privacidad', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Configuración de privacidad actualizada correctamente');
        } else {
            alert(result.error || 'Error al actualizar la configuración de privacidad');
        }
    } catch (error) {
        alert('Error al actualizar la configuración de privacidad');
        console.error(error);
    }
});
</script>
{% endblock %}
