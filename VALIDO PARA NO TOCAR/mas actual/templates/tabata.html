{% extends "base.html" %}

{% block title %}Tabata - Sistema de Entrenamiento{% endblock %}

{% block content %}
<div class="tabata-container">
    <h1>Temporizador Tabata</h1>
    
    <div class="tabata-timer">
        <div class="timer-display">
            <span id="minutes">00</span>:<span id="seconds">00</span>
        </div>
        
        <div class="timer-controls">
            <div class="control-group">
                <label for="work-time">Tiempo de Trabajo (segundos):</label>
                <input type="number" id="work-time" value="20" min="1" max="300">
            </div>
            
            <div class="control-group">
                <label for="rest-time">Tiempo de Descanso (segundos):</label>
                <input type="number" id="rest-time" value="10" min="1" max="300">
            </div>
            
            <div class="control-group">
                <label for="rounds">Número de Rondas:</label>
                <input type="number" id="rounds" value="8" min="1" max="20">
            </div>
            
            <div class="control-group">
                <label for="warmup">Calentamiento (segundos):</label>
                <input type="number" id="warmup" value="60" min="0" max="600">
            </div>
            
            <div class="control-group">
                <label for="cooldown">Enfriamiento (segundos):</label>
                <input type="number" id="cooldown" value="60" min="0" max="600">
            </div>
        </div>
        
        <div class="timer-buttons">
            <button id="start-btn" class="btn-primary">
                <i class="fas fa-play"></i> Iniciar
            </button>
            <button id="pause-btn" class="btn-secondary" disabled>
                <i class="fas fa-pause"></i> Pausar
            </button>
            <button id="reset-btn" class="btn-secondary">
                <i class="fas fa-redo"></i> Reiniciar
            </button>
        </div>
        
        <div class="timer-status">
            <div class="status-item">
                <span class="status-label">Ronda Actual:</span>
                <span id="current-round">0/0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Fase:</span>
                <span id="current-phase">Preparado</span>
            </div>
        </div>
    </div>
</div>

<style>
.tabata-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.tabata-timer {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    padding: 30px;
    text-align: center;
}

.timer-display {
    font-size: 4em;
    font-weight: bold;
    color: #ff4d00;
    margin-bottom: 30px;
    font-family: monospace;
}

.timer-controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.control-group {
    text-align: left;
}

.control-group label {
    display: block;
    margin-bottom: 5px;
    color: #ff8533;
}

.control-group input {
    width: 100%;
    padding: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.2);
    color: white;
}

.timer-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
}

.btn-primary,
.btn-secondary {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 5px;
}

.btn-primary {
    background: #ff4d00;
    color: white;
}

.btn-primary:hover {
    background: #ff8533;
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
}

.btn-secondary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.timer-status {
    display: flex;
    justify-content: center;
    gap: 30px;
}

.status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.status-label {
    color: #ff8533;
    font-size: 0.9em;
    margin-bottom: 5px;
}

#current-round,
#current-phase {
    color: white;
    font-size: 1.2em;
    font-weight: bold;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.timer-display.active {
    animation: pulse 1s infinite;
}
</style>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/tabata.js') }}"></script>
{% endblock %}
